{% extends 'layout/main.html' %}

{% block content %}

<section>
    <div class="container">
        <div class="row">

            <div class="col-sm-3">
                <div class="left-sidebar">

                    <h2>Account</h2>

                    <div class="panel-group category-products" id="accordian">

                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <h4 class="panel-title">
                                    <a href="{{ url_for('account.update') }}">
                                        Account
                                    </a>
                                </h4>
                            </div>
                        </div>

                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <h4 class="panel-title">
                                    <a href="{{ url_for('my-product.my_product') }}">
                                        My product
                                    </a>
                                </h4>
                            </div>
                        </div>

                    </div>

                </div>
            </div>


            <div class="col-sm-9">

                <div class="blog-post-area">

                    <h2 class="title text-center">
                        Edit Product
                    </h2>

                    <div class="signup-form">

                        <h2>Update Product</h2>

                        <form
                            method="POST"
                            action="{{ url_for('edit_product.edit', id=product['id']) }}"
                        >

                            <input
                                type="text"
                                name="title"
                                placeholder="Product Name"
                                value="{{ product['title'] }}"
                                required
                            />

                            <input
                                type="number"
                                name="price"
                                placeholder="Price"
                                value="{{ product['price'] }}"
                                required
                            />

                            {% if product['image'] %}
                                <div style="margin: 15px 0;">
                                    <p>Current image:</p>

                                    <img
                                        src="{{ url_for('static', filename=product['image']) }}"
                                        width="150"
                                        alt="Product image"
                                    >
                                </div>
                            {% endif %}

                            
                            <button
                                type="submit"
                                class="btn btn-default"
                            >
                                Update Product
                            </button>

                            <a
                                href="{{ url_for('my-product.my_product') }}"
                                class="btn btn-default"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>
</section>


{% endblock %}
